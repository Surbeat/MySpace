<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0818"/>
      <stop offset="60%" stop-color="#12020a"/>
      <stop offset="100%" stop-color="#060104"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#e6a817"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#800020"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Outer Vinyl Rim -->
  <circle cx="256" cy="256" r="190" fill="#0d0208" stroke="#331020" stroke-width="4"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#220815" stroke-width="2"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#2a0a1a" stroke-width="2"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#1f0714" stroke-width="2"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#331020" stroke-width="3"/>

  <!-- Center Vinyl Label -->
  <circle cx="256" cy="256" r="90" fill="url(#burgundyGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="82" fill="#14020b" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Center Spindle Hole -->
  <circle cx="256" cy="256" r="22" fill="#060104" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- SurBeat Symbol / S Wave -->
  <path d="M 230 185 C 275 175 300 210 270 240 C 240 270 215 285 255 325 C 285 350 250 365 220 350" 
        fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Soundwave accents -->
  <circle cx="340" cy="256" r="6" fill="#ffd700"/>
  <circle cx="360" cy="256" r="4" fill="#ffd700" opacity="0.7"/>
  <circle cx="376" cy="256" r="3" fill="#ffd700" opacity="0.4"/>
  <circle cx="172" cy="256" r="6" fill="#ffd700"/>
  <circle cx="152" cy="256" r="4" fill="#ffd700" opacity="0.7"/>
  <circle cx="136" cy="256" r="3" fill="#ffd700" opacity="0.4"/>
</svg>
