# Cloudflare Pages Configuration for SurBeat
# This file configures the frontend deployment to Cloudflare Pages

name = "surbeat"
main = "index.html"
compatibility_date = "2024-08-13"

# Build settings
[build]
command = "echo 'Static site - no build needed'"
directory = "."
watch_paths = ["index.html", "*.css"]

# Environment variables (example)
# Set these in Cloudflare Pages dashboard
# [env.production]
# vars = { API_BASE_URL = "https://api.myspace.example.com" }

# Routes configuration
[routes]
pattern = "example.com/*"
zone_name = "example.com"
